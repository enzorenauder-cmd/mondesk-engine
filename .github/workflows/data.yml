name: Donnees Twelve Data
on:
  schedule:
    # Heure UTC : 6 h 50 à 18 h 50 UTC = 7 h 50 à 19 h 50 Paris (hiver), 25 min avant chaque passage du Radar ; lundi-vendredi
    # GitHub saute parfois un horaire : trois essais par heure, le programme ne retélécharge pas si les données ont moins de 25 min
    - cron: "38 5-18 * * 1-5"
    - cron: "47 5-18 * * 1-5"
    - cron: "56 5-18 * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recupere les donnees precedentes (branche data)
        run: |
          git fetch origin data --depth=1 || true
          mkdir -p data
          git show origin/data:data.tar.gz > prev.tar.gz 2>/dev/null && tar xzf prev.tar.gz || true
      - name: Bougies Twelve Data
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python3 fetch_data.py
      - name: Publie sur la branche data (un seul commit, ecrase)
        run: |
          tar czf /tmp/data.tar.gz data
          cp data/meta.json /tmp/meta.json
          git config user.name "mondesk-bot"
          git config user.email "mondesk-bot@users.noreply.github.com"
          git checkout --orphan data-new
          git rm -rf . -q
          cp /tmp/data.tar.gz data.tar.gz
          cp /tmp/meta.json meta.json
          git add data.tar.gz meta.json
          git commit -q -m "donnees $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin data-new:data
